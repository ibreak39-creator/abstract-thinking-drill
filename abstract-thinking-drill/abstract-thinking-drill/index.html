<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>頭が良くなる抽象具体ドリル</title>
    <meta
      name="description"
      content="抽象と具体を行き来する力を鍛えるシンプルな練習サイト。"
    >
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <p class="eyebrow">Thinking Drill</p>
        <h1>頭が良くなる抽象具体ドリル</h1>
      </header>

      <section class="level-switch" aria-label="難易度選択">
        <button class="level-button active" type="button" data-level="beginner">
          <strong>初級</strong>
          <span>1つ選ぶ</span>
        </button>
        <button class="level-button" type="button" data-level="intermediate">
          <strong>中級</strong>
          <span>すべて選ぶ</span>
        </button>
        <button class="level-button" type="button" data-level="advanced">
          <strong>上級</strong>
          <span>自分で打つ</span>
        </button>
      </section>

      <section class="progress-row" aria-label="進捗">
        <div>
          <span id="question-number">1 / 1</span>
          <p id="level-note">選んで、抽象と具体の感覚をつかむ</p>
        </div>
        <div class="dot-map" id="question-map" aria-label="問題一覧"></div>
      </section>

      <article class="question-card" id="question-card" aria-live="polite">
        <div class="question-label" id="question-type">具体 → 抽象</div>
        <h2 id="question-title">問題タイトル</h2>
        <p class="question-prompt" id="question-prompt"></p>

        <div class="answer-area" id="choice-area"></div>

        <label class="text-answer" id="text-answer-wrap" hidden>
          <span>あなたの答え</span>
          <textarea
            id="answer-input"
            rows="7"
            placeholder="例：つまり、〇〇ということです。たとえば、△△の場面でも同じことが言えます。"
          ></textarea>
        </label>

        <div class="action-row">
          <button class="secondary-button" type="button" id="hint-button">ヒント</button>
          <button class="primary-button" type="button" id="check-button">✓ 回答して次へ</button>
        </div>

        <section class="feedback" id="feedback-panel" hidden>
          <div id="result-panel" hidden>
            <h3 id="result-title">結果</h3>
            <p id="result-text"></p>
          </div>
          <div id="hint-panel" hidden>
            <h3>ヒント</h3>
            <p id="hint-text"></p>
          </div>
          <div id="answer-panel" hidden>
            <h3>考え方</h3>
            <p id="model-answer"></p>
          </div>
        </section>
      </article>

      <section class="result-card" id="final-result" hidden>
        <p class="eyebrow">Result</p>
        <h2 id="final-title">結果</h2>
        <p class="score-text" id="final-score"></p>
        <p class="score-message" id="final-message"></p>
        <div class="score-breakdown" id="score-breakdown" hidden></div>
        <button class="primary-button" type="button" id="restart-button">もう一回やる</button>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
